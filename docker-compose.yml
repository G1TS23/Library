services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    # Healthcheck : l'appli ne démarrera qu'une fois la base prête à accepter des connexions.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    # Réutilise le Dockerfile natif généré par Quarkus ; le contexte est la racine
    # du projet, car il copie target/*-runner (le binaire déjà compilé).
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.native
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Ce que le profil %dev fournissait, réinjecté pour le profil prod (natif).
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/library
      QUARKUS_DATASOURCE_USERNAME: library
      QUARKUS_DATASOURCE_PASSWORD: library
      # Sans ça, aucune table n'est créée → 500 sur /books.
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: drop-and-create

volumes:
  db-data:
