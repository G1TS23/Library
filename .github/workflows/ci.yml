name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build & Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B verify
      - name: SonarCloud analysis
        if: github.actor != 'dependabot[bot]'
        run: ./mvnw -B sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5
        if: github.ref == 'refs/heads/main'

  mutation-test:
    name: Mutation Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage -P pit

      - name: Upload mutation test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pit-report
          path: target/pit-reports

      - name: Summarize mutation test report
        if: always()
        run: |
          python3 - > pit-comment.md <<'PY'
          import xml.etree.ElementTree as ET, os
          p="target/pit-reports/mutations.xml"
          if os.path.exists(p):
              m=ET.parse(p).getroot().findall("mutation")
              total=len(m); killed=sum(1 for x in m if x.get("detected")=="true")
              surv=[(x.findtext("sourceFile"),x.findtext("lineNumber"),x.get("status"))
                    for x in m if x.get("detected")!="true"]
          else:
              total=killed=0; surv=[]
          score=f"{100*killed/total:.1f}" if total else "n/a"
          ok="✅" if total and killed==total else "⚠️"
          print("## 🧬 Mutation testing (PIT)\n")
          print(f"**Score : {killed}/{total} ({score}%)** {ok}\n")
          if surv:
              print("<details><summary>Mutants survivants</summary>\n")
              for f,l,s in surv: print(f"- `{f}:{l}` — {s}")
              print("\n</details>")
          PY
          cat pit-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: mutation-testing
          path: pit-comment.md