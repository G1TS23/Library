name: Container Build

# La CI principale ne construit aucune image : elle valide le code, pas le conteneur.
# Ce workflow comble ce trou, mais seulement quand les fichiers concernés bougent —
# une compilation native coûte plusieurs minutes, inutile de la payer à chaque PR.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/container-build.yml'
  pull_request:
    paths:
      - 'src/main/docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/container-build.yml'
  workflow_dispatch:

jobs:
  native-image:
    name: Native Image & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # container-build=true n'est pas un détail : il compile dans une image
      # builder basée sur UBI, donc contre la même glibc que l'image d'exécution.
      # Une compilation sur le runner Ubuntu produirait un binaire lié à une glibc
      # plus récente, qui échouerait au démarrage dans le conteneur UBI 9.
      - name: Compiler le binaire natif
        run: ./mvnw -B package -Pnative -Dquarkus.native.container-build=true -DskipTests

      # Les tests tournent déjà dans le job « Build & Analyze » ; ce qu'on vérifie
      # ici, c'est le conteneur et la configuration du profil prod.
      - name: Construire et démarrer la stack
        run: docker compose up -d --build

      - name: Vérifier que l'application répond
        run: |
          # Attente du démarrage : /q/openapi est servi dès que le serveur écoute.
          ready=0
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:8080/q/openapi; then
              ready=$i
              break
            fi
            sleep 3
          done

          if [ "$ready" -eq 0 ]; then
            echo "::error::L'application n'a pas répondu dans le délai imparti."
            exit 1
          fi

          # Pas de -f ici : on veut lire le code, pas interrompre la commande.
          openapi=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/q/openapi)
          # /books traverse Hibernate et Postgres : c'est ce qui prouve que la
          # configuration par variables d'environnement du profil prod est bonne.
          books=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/books)

          # La version d'UBI est ce que font varier les PR Dependabot « docker » :
          # l'inscrire au résumé dit sur quelle base l'image a réellement été testée.
          image_id=$(docker compose images -q app)
          base=$(docker inspect "$image_id" \
                   --format '{{index .Config.Labels "name"}}:{{index .Config.Labels "version"}}' \
                 2>/dev/null || echo "inconnue")
          startup=$(docker compose logs app 2>/dev/null \
                    | grep -o 'started in [0-9.]*s' | tail -1 | sed 's/started in //')

          {
            echo "## 🐳 Image conteneur"
            echo
            echo "| Vérification | Résultat |"
            echo "|---|---|"
            echo "| Image de base | \`$base\` |"
            if [ -n "$startup" ]; then
              echo "| Démarrage natif | $startup |"
            fi
            echo "| Prêt après | ${ready} tentative(s) |"
            echo "| \`GET /q/openapi\` | HTTP $openapi |"
            echo "| \`GET /books\` (Hibernate → Postgres) | HTTP $books |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$openapi" != "200" ] || [ "$books" != "200" ]; then
            echo "::error::Réponse inattendue (openapi=$openapi, books=$books)."
            exit 1
          fi

      - name: Journaux des conteneurs
        if: failure()
        run: docker compose logs

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
