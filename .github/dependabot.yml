version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    # Sept jours de carence : laisse passer les correctifs qui suivent souvent une
    # sortie, plutôt que d'adopter une version publiée le jour même. Sans ce bloc,
    # Dependabot applique quand même un défaut de 3 jours.
    cooldown:
      default-days: 7
    groups:
      # L'ordre compte : une dépendance rejoint le PREMIER groupe qu'elle matche.
      # Quarkus est déclaré en tête pour rester isolé — le BOM déplace tout l'arbre
      # transitif, si la CI casse dessus on veut qu'il soit seul en cause.
      quarkus:
        patterns: ["io.quarkus*"]
      # Tout le reste en une PR. Les majeures en sont exclues (absentes de
      # update-types) et continuent d'arriver seules, pour être lues seules.
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  # Pas de cooldown ici : les registres Docker n'exposent pas de date de
  # publication, Dependabot ne peut donc pas calculer l'âge d'un tag.
  - package-ecosystem: docker
    directory: "/src/main/docker"
    schedule:
      interval: monthly
