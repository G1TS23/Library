version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    # Sept jours de carence : laisse passer les correctifs qui suivent souvent une
    # sortie, plutôt que d'adopter une version publiée le jour même. Sans ce bloc,
    # Dependabot applique quand même un défaut de 3 jours.
    cooldown:
      default-days: 7
    groups:
      quarkus:
        patterns: ["io.quarkus*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  # Pas de cooldown ici : les registres Docker n'exposent pas de date de
  # publication, Dependabot ne peut donc pas calculer l'âge d'un tag.
  - package-ecosystem: docker
    directory: "/src/main/docker"
    schedule:
      interval: monthly
